<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VayuDrishti | Jaipur Telemetry Engine</title>

  <!-- Google Fonts: Plus Jakarta Sans + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN with Custom Tokens -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            softCream: '#FAF8F5',
            mutedSand: '#F3ECE2',
            emeraldLive: '#10B981',
            deepMoss: '#059669',
            mintGlow: '#34D399',
            amberWarn: '#F59E0B',
            roseHazard: '#EF4444',
            cyberCanvas: '#0F172A',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-softCream text-cyberCanvas font-sans antialiased selection:bg-emeraldLive selection:text-white">

  <div class="min-h-screen flex flex-col p-4 md:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto">

    <!-- 1. Header Cockpit Bar -->
    <header class="glass-panel rounded-2xl p-4 flex flex-wrap justify-between items-center shadow-sm">
      <div class="flex items-center space-x-3">
        <div class="w-3 h-3 rounded-full bg-emeraldLive animate-ping"></div>
        <h1 class="text-xl font-bold text-deepMoss tracking-tight">VayuDrishti</h1>
        <span class="text-xs font-mono bg-mutedSand px-2 py-0.5 rounded text-deepMoss font-semibold">JAIPUR_CORE</span>
      </div>

      <!-- Tab Buttons -->
      <nav class="flex space-x-1 bg-mutedSand/60 p-1 rounded-xl">
        <button onclick="switchTab('telemetry')" id="tab-telemetry-btn" class="px-4 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition-all bg-white text-deepMoss shadow-sm">Live Telemetry</button>
        <button onclick="switchTab('forecast')" id="tab-forecast-btn" class="px-4 py-1.5 rounded-lg text-xs md:text-sm font-medium text-slate-600 hover:text-deepMoss transition-all">48h Forecast</button>
      </nav>

      <!-- Latency & Buffer Status -->
      <div class="flex items-center space-x-4 font-mono text-xs text-slate-600">
        <span>PING: <strong class="text-emeraldLive" id="sys-ping">14ms</strong></span>
        <span>BUFFER: <strong class="text-emeraldLive">99.8%</strong></span>
      </div>
    </header>

    <!-- 2. Main Workstation Area -->
    <main class="flex-1">
      <!-- View 1: Telemetry (Map + Sensor Cards) -->
      <div id="view-telemetry" class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Left 60%: Map Container -->
        <div class="lg:col-span-7 glass-panel rounded-2xl p-4 flex flex-col h-[520px] relative overflow-hidden">
          <div class="flex justify-between items-center mb-3">
            <span class="text-xs font-mono tracking-wider text-slate-500 uppercase">Geospatial Radar Sweep</span>
            <span class="text-xs font-mono text-emeraldLive font-semibold">● ACTIVE_PULSE</span>
          </div>
          <div id="map" class="w-full flex-1 rounded-xl relative z-10"></div>
          <!-- Radar Overlay -->
          <div class="radar-sweep-overlay"></div>
        </div>

        <!-- Right 40%: Hotspot Cards -->
        <div class="lg:col-span-5 space-y-4 h-[520px] overflow-y-auto pr-1" id="hotspots-list">
          <!-- JS will render cards here -->
        </div>
      </div>

      <!-- View 2: 48h Forecast Chart (Default Hidden) -->
      <div id="view-forecast" class="glass-panel rounded-2xl p-6 hidden">
        <h2 class="text-lg font-bold text-deepMoss mb-4">48-Hour Predictive AQI Matrix</h2>
        <div class="w-full h-80">
          <canvas id="forecastChart"></canvas>
        </div>
      </div>
    </main>

    <!-- 3. Mini Terminal (Bottom-Right) -->
    <div class="fixed bottom-4 right-4 z-50 w-80 glass-panel bg-cyberCanvas/95 border border-slate-700 text-mintGlow p-3 rounded-xl font-mono text-xs shadow-2xl">
      <div class="flex justify-between items-center pb-2 mb-2 border-b border-slate-800 text-slate-400">
        <span class="text-[11px] font-bold">TERMINAL_LOGS</span>
        <span class="w-2 h-2 rounded-full bg-mintGlow animate-pulse"></span>
      </div>
      <div id="terminal-logs" class="space-y-1 h-14 overflow-hidden text-[10px] text-slate-300">
        <p>> [SYS_OK] Pipeline connected to Jaipur Sector...</p>
      </div>
    </div>

  </div>

  <!-- Leaflet JS & Chart.js CDNs -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Logic Script -->
  <script src="app.js"></script>
</body>
</html>
